<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Route 25 — Elite Trainers Admin</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#05060a" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background: #05060a; color: #e8e8ef; }
    main { max-width: 820px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { color: #b7b7c7; margin: 0 0 18px; line-height: 1.4; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; padding: 14px; margin: 14px 0; }
    label { display: block; font-size: 12px; color: #b7b7c7; margin-bottom: 6px; }
    input, textarea { width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: #fff; padding: 10px 12px; font-size: 14px; }
    textarea { min-height: 70px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 740px) { .row { grid-template-columns: 1fr 1fr; } }
    button { border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 600; cursor: pointer; background: #3b82f6; color: white; }
    button.secondary { background: rgba(255,255,255,0.10); }
    button.danger { background: #ef4444; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .muted { color: #b7b7c7; font-size: 12px; }
    .list { margin: 0; padding: 0; list-style: none; }
    .item { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.10); }
    .item + .item { margin-top: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .err { color: #fecaca; }
    .ok { color: #bbf7d0; }
  </style>
</head>
<body>
  <main>
    <h1>Elite Trainers Admin</h1>
    <p>Manually grant or revoke the <span class="mono">badge-elite</span> badge by Trainer ID. Keep this page private.</p>

    <div class="card">
      <div class="row">
        <div>
          <label for="opsToken">Ops token</label>
          <input id="opsToken" placeholder="Paste x-rakTec-ops token" autocomplete="off" spellcheck="false" />
          <div class="muted" style="margin-top: 6px;">Stored in <span class="mono">sessionStorage</span> only.</div>
        </div>
        <div style="display:flex; align-items:flex-end; gap:10px;">
          <button id="saveToken" class="secondary" type="button">Save token</button>
          <button id="clearToken" class="secondary" type="button">Clear</button>
          <button id="refresh" type="button">Refresh list</button>
        </div>
      </div>
      <div id="tokenStatus" class="muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 10px; font-size:16px;">Grant</h2>
      <div class="row">
        <div>
          <label for="trainerId">Trainer ID</label>
          <input id="trainerId" placeholder="e.g. 8dHIaVfOcdg96oKjImpjFYQB1C73" autocomplete="off" spellcheck="false" />
        </div>
        <div>
          <label for="note">Note (optional)</label>
          <input id="note" placeholder="e.g. TikTok partner" autocomplete="off" spellcheck="false" />
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button id="grant" type="button">Grant Elite Trainer</button>
      </div>
      <div id="grantStatus" class="muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 10px; font-size:16px;">Current elite trainers</h2>
      <ul id="list" class="list"></ul>
      <div id="listStatus" class="muted" style="margin-top:10px;"></div>
    </div>
  </main>

  <script>
    const API_PATH = "/api/__proxy/moderation/elite-trainers";
    const STORAGE_KEY = "route25.opsToken";

    const el = (id) => document.getElementById(id);
    const opsTokenInput = el("opsToken");
    const tokenStatus = el("tokenStatus");
    const listEl = el("list");
    const listStatus = el("listStatus");
    const grantStatus = el("grantStatus");
    const trainerIdInput = el("trainerId");
    const noteInput = el("note");

    function setStatus(target, text, cls) {
      target.className = cls ? cls : "muted";
      target.textContent = text || "";
    }

    function getToken() {
      return (sessionStorage.getItem(STORAGE_KEY) || "").trim();
    }

    function setToken(value) {
      const trimmed = (value || "").trim();
      if (trimmed) sessionStorage.setItem(STORAGE_KEY, trimmed);
      else sessionStorage.removeItem(STORAGE_KEY);
      opsTokenInput.value = trimmed;
      setStatus(tokenStatus, trimmed ? "Token loaded." : "No token set.", trimmed ? "ok" : "muted");
    }

    async function apiFetch(path, init) {
      const token = getToken();
      if (!token) throw new Error("Missing ops token");
      const headers = Object.assign({}, init?.headers || {}, { "x-raktec-ops": token });
      const res = await fetch(path, Object.assign({}, init || {}, { headers }));
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch { /* ignore */ }
      if (!res.ok) {
        const detail = json?.detail || json?.error || text || `HTTP ${res.status}`;
        throw new Error(detail);
      }
      return json;
    }

    function renderList(items) {
      listEl.innerHTML = "";
      for (const entry of items) {
        const li = document.createElement("li");
        li.className = "item";

        const left = document.createElement("div");
        left.style.minWidth = "0";
        left.innerHTML = `
          <div class="mono" style="font-size:13px; word-break:break-all;">${escapeHtml(entry.trainerId || "")}</div>
          <div class="muted" style="margin-top:4px;">${escapeHtml(entry.note || "")}</div>
        `;

        const right = document.createElement("div");
        right.style.display = "flex";
        right.style.gap = "8px";

        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "secondary";
        copyBtn.textContent = "Copy ID";
        copyBtn.onclick = async () => {
          await navigator.clipboard.writeText(entry.trainerId || "");
          setStatus(listStatus, "Copied.", "ok");
        };

        const revokeBtn = document.createElement("button");
        revokeBtn.type = "button";
        revokeBtn.className = "danger";
        revokeBtn.textContent = "Revoke";
        revokeBtn.onclick = async () => {
          revokeBtn.disabled = true;
          try {
            await apiFetch(`${API_PATH}?trainerId=${encodeURIComponent(entry.trainerId || "")}`, { method: "DELETE" });
            await refreshList();
          } catch (e) {
            setStatus(listStatus, String(e?.message || e), "err");
          } finally {
            revokeBtn.disabled = false;
          }
        };

        right.append(copyBtn, revokeBtn);
        li.append(left, right);
        listEl.appendChild(li);
      }
    }

    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function refreshList() {
      setStatus(listStatus, "Loading…", "muted");
      try {
        const json = await apiFetch(API_PATH, { method: "GET" });
        const data = Array.isArray(json?.data) ? json.data : [];
        renderList(data);
        setStatus(listStatus, data.length ? `Loaded ${data.length}.` : "No elite trainers yet.", "muted");
      } catch (e) {
        renderList([]);
        setStatus(listStatus, String(e?.message || e), "err");
      }
    }

    async function grant() {
      const trainerId = (trainerIdInput.value || "").trim();
      const note = (noteInput.value || "").trim();
      if (!trainerId) {
        setStatus(grantStatus, "Trainer ID required.", "err");
        return;
      }
      setStatus(grantStatus, "Granting…", "muted");
      el("grant").disabled = true;
      try {
        await apiFetch(API_PATH, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ trainerId, note: note || undefined })
        });
        trainerIdInput.value = "";
        noteInput.value = "";
        setStatus(grantStatus, "Granted.", "ok");
        await refreshList();
      } catch (e) {
        setStatus(grantStatus, String(e?.message || e), "err");
      } finally {
        el("grant").disabled = false;
      }
    }

    el("saveToken").onclick = () => setToken(opsTokenInput.value);
    el("clearToken").onclick = () => setToken("");
    el("refresh").onclick = () => refreshList();
    el("grant").onclick = () => grant();

    setToken(getToken());
    if (getToken()) refreshList();
  </script>
</body>
</html>
