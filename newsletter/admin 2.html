<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsletter review — Route 25</title><link rel="stylesheet" href="/newsletter/newsletter.css"></head><body><header><a class="brand" href="/">Route <span>25</span></a><nav><a href="/newsletter">Public archive</a></nav></header><main><p class="eyebrow">Private editorial desk</p><h1>Review queue</h1><section class="section"><label>Firebase ID token</label><input id="token" type="password" autocomplete="off"><p><button id="load">Load submissions</button></p><small>For the MVP, paste a signed-in Route 25 Firebase ID token. Only allowlisted accounts are accepted.</small></section><div id="queue"></div><section class="section"><h2>Issue editor</h2><form id="editor"><div class="two"><div><label>Title</label><input name="title" required></div><div><label>Slug</label><input name="slug" required></div></div><label>Trainer name</label><input name="trainerName"><label>Submission ID</label><input name="submissionId"><label>Deck / email preview</label><textarea name="dek"></textarea><label>Summary</label><textarea name="summary" required></textarea><label>Article HTML</label><textarea name="bodyHtml" style="min-height:260px"></textarea><label>Images JSON</label><textarea name="images" placeholder='[{"url":"https://…","alt":"…"}]'></textarea><label>Interview answers JSON</label><textarea name="interviewAnswers" placeholder='[{"question":"…","answer":"…"}]'></textarea><label>Affiliate products JSON</label><textarea name="products" placeholder='[{"name":"Vault X binder","type":"amazon","url":"https://…","note":"…"}]'></textarea><div class="two"><div><label>Status</label><select name="status"><option>draft</option><option>scheduled</option><option>published</option></select></div><div><label>Subscribe URL</label><input name="subscribeUrl" type="url"></div></div><p><button class="red">Save issue</button></p></form><div id="editorResult"></div></section></main><footer>Route 25 editorial tools.</footer><script>const auth=()=>({'authorization':'Bearer '+document.querySelector('#token').value});document.querySelector('#load').onclick=async()=>{const r=await fetch('/api/newsletter?action=admin-list',{headers:auth()}),x=await r.json();document.querySelector('#queue').innerHTML=r.ok?`<table><tr><th>Collector</th><th>Focus</th><th>Status</th><th></th></tr>${x.submissions.map(s=>`<tr><td><strong>${s.name}</strong><br><small>${s.email}</small></td><td>${s.collectionFocus}</td><td><select data-id="${s.id}">${['submitted','reviewing','selected','draft','scheduled','published','declined'].map(v=>`<option ${v===s.status?'selected':''}>${v}</option>`).join('')}</select></td><td><button onclick="update('${s.id}')">Save</button></td></tr>`).join('')}</table>`:`<p class="notice">${x.error}</p>`};async function update(id){const status=document.querySelector(`[data-id="${id}"]`).value;await fetch('/api/newsletter?action=admin-update&id='+id,{method:'PATCH',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify({status})})}document.querySelector('#editor').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const k of ['images','interviewAnswers','products']){try{data[k]=data[k]?JSON.parse(data[k]):[]}catch{return document.querySelector('#editorResult').textContent=`Invalid ${k} JSON`}}const r=await fetch('/api/newsletter?action=admin-save-issue',{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify(data)}),x=await r.json();document.querySelector('#editorResult').innerHTML=r.ok?`<p class="notice">Saved. <a href="/newsletter/${x.slug}">View issue</a> · Email export: <code>/api/newsletter?action=email-export&amp;slug=${x.slug}</code></p>`:`<p class="notice">${x.error}</p>`};</script></body></html>
