<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collector Story — Route 25</title><link rel="stylesheet" href="/newsletter/newsletter.css"></head><body><header><a class="brand" href="/">Route <span>25</span></a><nav><a href="/search">Search</a><a href="/newsletter">All stories</a><a href="/newsletter/submit">Share yours</a></nav></header><main id="issue"><p>Loading story…</p></main><footer>Some links may be affiliate links. Purchases support Route 25 at no additional cost to you.</footer><script>const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').filter(Boolean).pop();const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/newsletter?action=issue&slug='+encodeURIComponent(slug)).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x.issue}).then(i=>{document.title=i.title+' — Route 25';document.querySelector('#issue').innerHTML=`<p class="eyebrow">${esc(i.trainerName||'Collector Story')}</p><h1>${esc(i.title)}</h1><p class="lede">${esc(i.dek||i.summary)}</p>${i.images?.[0]?.url?`<figure class="issue-hero"><img src="${esc(i.images[0].url)}" alt="${esc(i.images[0].alt)}">${i.images[0].caption?`<figcaption>${esc(i.images[0].caption)}</figcaption>`:''}</figure>`:''}<article class="prose">${i.bodyHtml||`<p>${esc(i.summary)}</p>`}</article>${i.interviewAnswers?.length?`<section class="interview"><p class="eyebrow">The interview</p><h2>Five questions</h2>${i.interviewAnswers.map(a=>`<article class="answer"><h3>${esc(a.question)}</h3><p>${esc(a.answer)}</p></article>`).join('')}</section>`:''}${i.images?.length>1?`<section><p class="eyebrow">Collection tour</p><h2>Inside the collection</h2><div class="story-gallery">${i.images.slice(1).map(x=>`<figure><a href="${esc(x.url)}" target="_blank"><img src="${esc(x.url)}" alt="${esc(x.alt)}"></a>${x.caption?`<figcaption>${esc(x.caption)}</figcaption>`:''}</figure>`).join('')}</div></section>`:''}${i.products?.length?`<section><h2>Collector’s corner</h2>${i.products.map(p=>`<div class="product"><div><strong>${esc(p.name)}</strong><br><small>${esc(p.note)}</small></div>${p.url?`<a rel="sponsored nofollow" href="${esc(p.url)}">View gear</a>`:''}</div>`).join('')}</section>`:''}<section class="section"><h2>Get the next collector story</h2><a class="button red" href="${esc(i.subscribeUrl||'/newsletter/subscribe')}">Subscribe</a></section>`}).catch(e=>document.querySelector('#issue').innerHTML=`<h1>Story not found</h1><p>${esc(e.message)}</p>`);</script></body></html>
