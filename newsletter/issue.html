<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Collector Spotlight preview — Route 25</title>
  <link rel="stylesheet" href="/newsletter/newsletter.css">
</head>
<body>
<header class="newsletter-header"><a class="brand" href="/">Route <span>25</span></a><nav class="newsletter-nav"><a href="/search">Card search</a><a href="/newsletter">Spotlights</a><a href="/newsletter/submit">Share your collection</a><span class="social-toolbar"><a class="social-link" target="_blank" rel="noopener noreferrer" href="https://x.com/route25app" aria-label="Route 25 on X"><img src="/assets/social-x.svg" alt=""></a><a class="social-link" target="_blank" rel="noopener noreferrer" href="https://www.instagram.com/route25app/" aria-label="Route 25 on Instagram"><img src="/assets/social-instagram.svg" alt=""></a><a class="social-link" target="_blank" rel="noopener noreferrer" href="https://discord.gg/WncmGEFuNw" aria-label="Route 25 on Discord"><img src="/assets/social-discord.svg" alt=""></a><a class="social-link" target="_blank" rel="noopener noreferrer" href="https://apps.apple.com/us/app/route-25-tcg-social-network/id6755665546" aria-label="Download Route 25 on the App Store"><img src="/assets/social-apple.svg" alt=""></a></span></nav></header>
<main id="issue"><p>Loading story…</p></main>
<dialog id="storyLightbox" class="story-lightbox" aria-label="Expanded collection photo">
  <button type="button" class="lightbox-close" aria-label="Close image">×</button>
  <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous image" hidden>‹</button>
  <button type="button" class="lightbox-nav lightbox-next" aria-label="Next image" hidden>›</button>
  <figure><img alt="" role="button" tabindex="0" aria-label="Zoom in image" aria-pressed="false"><figcaption></figcaption></figure>
  <output class="lightbox-count" aria-live="polite" hidden></output>
</dialog>
<footer>Some links may be affiliate links. Purchases support Route 25 at no additional cost to you.</footer>
<script>
const params=new URLSearchParams(location.search),preview=params.get('preview')||location.pathname.match(/\/newsletter\/preview\/([a-f0-9]+)/)?.[1],slug=params.get('slug')||location.pathname.split('/').filter(Boolean).pop();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const textMarkup=value=>String(value||'').replace(/\r\n?/g,'\n').split(/\n{2,}/).map(paragraph=>paragraph.trim()).filter(Boolean).map(paragraph=>`<p>${esc(paragraph).replace(/\n/g,'<br>')}</p>`).join('');
const plainText=value=>String(value||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#(?:39|x27);/gi,"'").replace(/\s+/g,' ').trim();
const legacyHeadings=new Map([['the collection','collectionFocus'],['a favorite','favorite'],['the current chase','currentChase'],['the grail','grail']]),legacySection=/<h2(?:\s[^>]*)?>([\s\S]*?)<\/h2>\s*<p(?:\s[^>]*)?>([\s\S]*?)<\/p>/gi;
const legacyCollectionFields=issue=>{const fields={};for(const match of String(issue?.bodyHtml||'').matchAll(legacySection)){const key=legacyHeadings.get(plainText(match[1]).toLowerCase());if(key&&!fields[key])fields[key]=plainText(match[2])}return fields};
const collectionStoryFields=issue=>{const legacy=legacyCollectionFields(issue);return{collectionFocus:String(issue?.collectionFocus||legacy.collectionFocus||'').trim(),favorite:String(issue?.favorite||legacy.favorite||'').trim(),currentChase:String(issue?.currentChase||legacy.currentChase||'').trim(),grail:String(issue?.grail||legacy.grail||'').trim()}};
const storyBodyHtml=issue=>{let body=String(issue?.bodyHtml||'').trim();if(!body)return'';const first=body.match(/^<p(?:\s[^>]*)?>([\s\S]*?)<\/p>/i);if(first&&plainText(first[1])===plainText(issue?.summary))body=body.slice(first[0].length).trim();if(legacyCollectionFields(issue).collectionFocus)body=body.replace(legacySection,(section,heading)=>legacyHeadings.has(plainText(heading).toLowerCase())?'':section).trim();return body};
const trainerProfileUrl=value=>{const id=String(value||'').trim();return/^[A-Za-z0-9_-]{3,128}$/.test(id)?'/trainer/'+encodeURIComponent(id):''};
const displayDate=value=>{if(!value)value=new Date();try{return new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',month:'long',day:'numeric',year:'numeric'}).format(new Date(value))}catch{return''}};
const socialNetworks=[{domains:['x.com','twitter.com'],label:'Twitter (X)',displayHost:'x.com'},{domains:['instagram.com'],label:'Instagram'},{domains:['youtube.com','youtu.be'],label:'YouTube'},{domains:['tiktok.com'],label:'TikTok'},{domains:['threads.net'],label:'Threads'},{domains:['bsky.app'],label:'Bluesky'},{domains:['facebook.com','fb.com'],label:'Facebook'},{domains:['twitch.tv'],label:'Twitch'},{domains:['reddit.com'],label:'Reddit'},{domains:['linkedin.com'],label:'LinkedIn'},{domains:['pinterest.com'],label:'Pinterest'},{domains:['discord.com','discord.gg'],label:'Discord'},{domains:['linktr.ee'],label:'Linktree'},{domains:['tumblr.com'],label:'Tumblr'},{domains:['snapchat.com'],label:'Snapchat'},{domains:['mastodon.social'],label:'Mastodon'}];
const socialDetails=url=>{try{const parsed=new URL(url),host=parsed.hostname.replace(/^www\./,'').toLowerCase(),network=socialNetworks.find(item=>item.domains.some(domain=>host===domain||host.endsWith('.'+domain)));let path=parsed.pathname.replace(/\/+$/,'');try{path=decodeURIComponent(path)}catch{}return{label:network?.label||'Social profile',displayUrl:(network?.displayHost||host)+path}}catch{return{label:'Social profile',displayUrl:'View profile'}}};
const imageFigure=(image,className='',id='')=>image?.url?`<figure class="${className}"${id?` id="${esc(id)}"`:''}><button type="button" class="story-image-button" data-story-image="${esc(image.url)}" data-story-alt="${esc(image.alt)}" data-story-caption="${esc(image.caption)}" aria-label="View ${esc(image.alt||'collection photo')} larger"><img src="${esc(image.url)}" alt="${esc(image.alt)}"><span>View larger</span></button>${image.caption?`<figcaption>${esc(image.caption)}</figcaption>`:''}</figure>`:'';
const collectionProfile=i=>{const collection=collectionStoryFields(i),details=[['Favorite',collection.favorite],['Current chase',collection.currentChase],['Ultimate grail',collection.grail]].filter(([,value])=>value);return collection.collectionFocus||details.length?`<section class="collection-profile"><p class="eyebrow">Collection profile</p>${collection.collectionFocus?`<div class="collection-focus">${textMarkup(collection.collectionFocus)}</div>`:''}${details.length?`<div class="collection-highlights">${details.map(([label,value])=>`<article><small>${label}</small>${textMarkup(value)}</article>`).join('')}</div>`:''}</section>`:''};
const collectorCorner=products=>{const group=(title,items,label,field,sponsored)=>items.length?`<div class="collector-group"><h3>${title}</h3><div class="collector-items">${items.map(item=>{const url=item[field];return `<article class="collector-item"><div><strong>${esc(item.name)}</strong>${item.note?`<small>${esc(item.note)}</small>`:''}</div>${url?`<a target="_blank" rel="${sponsored?'noopener noreferrer sponsored nofollow':'noopener noreferrer'}" href="${esc(url)}">${label} <span aria-hidden="true">→</span></a>`:''}</article>`}).join('')}</div></div>`:'';return products?.length?`<section class="collector-corner"><p class="eyebrow">From the collection</p><h2>Collector’s corner</h2><p class="collector-intro">The cards and tools that help shape this collection.</p>${group('Cards mentioned',products.filter(item=>item.category==='card'),'View card','route25Url',false)}${group('Gear used',products.filter(item=>item.category!=='card'),'Shop gear','url',true)}</section>`:''};
fetch('/api/newsletter?action='+(preview?'issue-preview&token='+encodeURIComponent(preview):'issue&slug='+encodeURIComponent(slug))).then(async response=>{const data=await response.json();if(!response.ok)throw Error(data.error);return data.issue}).then(issue=>{
  document.title=issue.title+' — Route 25';
  const social=issue.socialUrl?socialDetails(issue.socialUrl):null,trainerUrl=trainerProfileUrl(issue.trainerId),storyBody=storyBodyHtml(issue);
  document.querySelector('#issue').innerHTML=`${preview?'<p class="notice"><strong>Private test preview.</strong> This unlisted link represents the draft connected to your test email.</p>':''}<p class="issue-meta">${issue.issueNumber?'Issue #'+esc(String(Number(issue.issueNumber)).padStart(3,'0')):'Collector Spotlight'}${displayDate(issue.publishedAt||issue.publishAt)?' · '+esc(displayDate(issue.publishedAt||issue.publishAt)):''}</p><p class="eyebrow">${esc(issue.trainerName||'Collector Spotlight')}</p><h1>${esc(issue.title)}</h1><div class="lede story-summary">${textMarkup(issue.summary)}</div>${social?`<p class="issue-social"><strong>${esc(social.label)}</strong><span aria-hidden="true">→</span><a target="_blank" href="${esc(issue.socialUrl)}" rel="noopener noreferrer me nofollow">${esc(social.displayUrl)}</a></p>`:''}${trainerUrl?`<p class="trainer-profile-cta"><a class="button" href="${esc(trainerUrl)}">View this trainer on Route 25</a></p>`:''}${imageFigure(issue.images?.[0],'issue-hero',issue.images?.length>1?'':'collection-photos')}${storyBody?`<article class="prose">${storyBody}</article>`:''}${collectionProfile(issue)}${issue.interviewAnswers?.length?`<section class="interview"><h2>Five questions</h2>${issue.interviewAnswers.map(answer=>`<article class="answer"><h3>${esc(answer.question)}</h3>${textMarkup(answer.answer)}</article>`).join('')}</section>`:''}${issue.images?.length>1?`<section id="collection-photos"><h2>Inside the collection</h2><div class="story-gallery">${issue.images.slice(1).map(image=>imageFigure(image)).join('')}</div></section>`:''}${collectorCorner(issue.products)}<section id="relatedStories" class="related-stories"><h2>Keep exploring</h2><a class="button" href="/newsletter">Browse all collector spotlights</a></section><section class="section subscribe-prompt"><h2>Get the next collector spotlight</h2><p>Delivered to your inbox every Saturday</p><a class="button red" href="/newsletter/subscribe">Subscribe</a></section>`;
  if(location.hash==='#collection-photos')requestAnimationFrame(()=>document.querySelector('#collection-photos')?.scrollIntoView());
  fetch('/api/newsletter?action=issues').then(response=>response.json()).then(data=>{const related=(data.issues||[]).filter(story=>story.slug!==issue.slug).slice(0,3),section=document.querySelector('#relatedStories');if(related.length)section.innerHTML=`<h2>More collector spotlights</h2><div class="related-grid">${related.map(story=>`<a class="related-card" href="/newsletter/${esc(story.slug)}">${story.images?.[0]?.url?`<img src="${esc(story.images[0].url)}" alt="">`:''}<strong>${esc(story.title)}</strong><span>${esc(story.dek||story.summary||'Read the spotlight')}</span></a>`).join('')}</div><a class="button" href="/newsletter">Browse all collector spotlights</a>`}).catch(()=>{});
}).catch(error=>document.querySelector('#issue').innerHTML=`<h1>Spotlight not found</h1><p>${esc(error.message)}</p>`);
const dialog=document.querySelector('#storyLightbox'),lightboxFigure=dialog.querySelector('figure'),lightboxImage=dialog.querySelector('img'),lightboxCaption=dialog.querySelector('figcaption'),lightboxPrevious=dialog.querySelector('.lightbox-prev'),lightboxNext=dialog.querySelector('.lightbox-next'),lightboxCount=dialog.querySelector('.lightbox-count');
let lightboxIndex=0;
const lightboxItems=()=>[...document.querySelectorAll('[data-story-image]')];
const setLightboxZoom=zoomed=>{lightboxImage.classList.toggle('is-zoomed',zoomed);lightboxImage.setAttribute('aria-pressed',String(zoomed));lightboxImage.setAttribute('aria-label',zoomed?'Zoom out image':'Zoom in image');if(!zoomed)lightboxFigure.scrollTo(0,0)};
const toggleLightboxZoom=event=>{const zooming=!lightboxImage.classList.contains('is-zoomed'),x=event?.offsetX/lightboxImage.clientWidth||.5,y=event?.offsetY/lightboxImage.clientHeight||.5;setLightboxZoom(zooming);if(zooming)requestAnimationFrame(()=>{lightboxFigure.scrollLeft=Math.max(0,x*lightboxImage.clientWidth-lightboxFigure.clientWidth/2);lightboxFigure.scrollTop=Math.max(0,y*lightboxImage.clientHeight-lightboxFigure.clientHeight/2)})};
const showLightboxImage=index=>{const items=lightboxItems();if(!items.length)return;setLightboxZoom(false);lightboxIndex=(index+items.length)%items.length;const trigger=items[lightboxIndex],multiple=items.length>1;lightboxImage.src=trigger.dataset.storyImage;lightboxImage.alt=trigger.dataset.storyAlt||'';lightboxCaption.textContent=trigger.dataset.storyCaption||'';lightboxCaption.hidden=!lightboxCaption.textContent;lightboxPrevious.hidden=!multiple;lightboxNext.hidden=!multiple;lightboxCount.hidden=!multiple;lightboxCount.textContent=`${lightboxIndex+1} / ${items.length}`};
document.addEventListener('click',event=>{const trigger=event.target.closest('[data-story-image]');if(!trigger)return;showLightboxImage(lightboxItems().indexOf(trigger));dialog.showModal()});
lightboxImage.addEventListener('click',toggleLightboxZoom);
lightboxImage.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleLightboxZoom()}});
lightboxPrevious.addEventListener('click',()=>showLightboxImage(lightboxIndex-1));
lightboxNext.addEventListener('click',()=>showLightboxImage(lightboxIndex+1));
dialog.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();showLightboxImage(lightboxIndex-1)}if(event.key==='ArrowRight'){event.preventDefault();showLightboxImage(lightboxIndex+1)}});
dialog.querySelector('.lightbox-close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
dialog.addEventListener('close',()=>{setLightboxZoom(false);lightboxImage.removeAttribute('src')});
</script>
</body>
</html>
