<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Collector Story preview — Route 25</title><link rel="stylesheet" href="/newsletter/newsletter.css"></head>
<body>
<header class="newsletter-header"><a class="brand" href="/">Route <span>25</span></a><nav class="newsletter-nav"><a href="/search">Card search</a><a href="/newsletter">Stories</a><a href="/newsletter/submit">Share your collection</a><span class="social-toolbar"><a class="social-link" target="_blank" rel="noopener noreferrer" href="https://x.com/route25app" aria-label="Route 25 on X"><img src="/assets/social-x.svg" alt=""></a><a class="social-link" target="_blank" rel="noopener noreferrer" href="https://www.instagram.com/route25app/" aria-label="Route 25 on Instagram"><img src="/assets/social-instagram.svg" alt=""></a><a class="social-link" target="_blank" rel="noopener noreferrer" href="https://discord.gg/WncmGEFuNw" aria-label="Route 25 on Discord"><img src="/assets/social-discord.svg" alt=""></a><a class="social-link" target="_blank" rel="noopener noreferrer" href="https://apps.apple.com/us/app/route-25-tcg-social-network/id6755665546" aria-label="Download Route 25 on the App Store"><img src="/assets/social-apple.svg" alt=""></a></span></nav></header>
<main id="issue"><p>Loading story…</p></main>
<footer>Some links may be affiliate links. Purchases support Route 25 at no additional cost to you.</footer>
<script>
const params=new URLSearchParams(location.search),preview=params.get('preview')||location.pathname.match(/\/newsletter\/preview\/([a-f0-9]+)/)?.[1],slug=params.get('slug')||location.pathname.split('/').filter(Boolean).pop();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const displayDate=value=>{if(!value)value=new Date();try{return new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',month:'long',day:'numeric',year:'numeric'}).format(new Date(value))}catch{return''}};
const socialLabel=url=>{try{const host=new URL(url).hostname.replace(/^www\./,'').toLowerCase();if(['x.com','twitter.com'].includes(host))return'X';if(host.includes('instagram.com'))return'Instagram';if(host.includes('youtube.com')||host==='youtu.be')return'YouTube';if(host.includes('tiktok.com'))return'TikTok';if(host.includes('threads.net'))return'Threads';return host}catch{return'Social'}};
fetch('/api/newsletter?action='+(preview?'issue-preview&token='+encodeURIComponent(preview):'issue&slug='+encodeURIComponent(slug))).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x.issue}).then(i=>{
  document.title=i.title+' — Route 25';
  const group=(title,items)=>items.length?`<h3>${title}</h3>${items.map(p=>`<div class="product"><div><strong>${esc(p.name)}</strong><br><small>${esc(p.note)}</small></div>${p.url?`<a rel="sponsored nofollow" href="${esc(p.url)}">View</a>`:''}</div>`).join('')}`:'';
  document.querySelector('#issue').innerHTML=`${preview?'<p class="notice"><strong>Private test preview.</strong> This unlisted link represents the draft connected to your test email.</p>':''}<p class="issue-meta">${i.issueNumber?'Issue #'+esc(String(Number(i.issueNumber)).padStart(3,'0')):'Collector Story'}${displayDate(i.publishedAt||i.publishAt)?' · '+esc(displayDate(i.publishedAt||i.publishAt)):''}</p><p class="eyebrow">${esc(i.trainerName||'Collector Story')}</p><h1>${esc(i.title)}</h1><p class="lede">${esc(i.dek||i.summary)}</p>${i.socialUrl?`<p class="issue-social"><a href="${esc(i.socialUrl)}" rel="me nofollow">${esc(socialLabel(i.socialUrl))}</a></p>`:''}${i.images?.[0]?.url?`<figure class="issue-hero"><img src="${esc(i.images[0].url)}" alt="${esc(i.images[0].alt)}">${i.images[0].caption?`<figcaption>${esc(i.images[0].caption)}</figcaption>`:''}</figure>`:''}<article class="prose">${i.bodyHtml||`<p>${esc(i.summary)}</p>`}</article>${i.interviewAnswers?.length?`<section class="interview"><h2>Five questions</h2>${i.interviewAnswers.map(a=>`<article class="answer"><h3>${esc(a.question)}</h3><p>${esc(a.answer)}</p></article>`).join('')}</section>`:''}${i.images?.length>1?`<section><h2>Inside the collection</h2><div class="story-gallery">${i.images.slice(1).map(x=>`<figure><a href="${esc(x.url)}" target="_blank"><img src="${esc(x.url)}" alt="${esc(x.alt)}"></a>${x.caption?`<figcaption>${esc(x.caption)}</figcaption>`:''}</figure>`).join('')}</div></section>`:''}${i.products?.length?`<section><h2>Collector’s corner</h2>${group('Cards mentioned',i.products.filter(p=>p.category==='card'))}${group('Gear used',i.products.filter(p=>p.category!=='card'))}</section>`:''}<section id="relatedStories" class="related-stories"><h2>Keep exploring</h2><a class="button" href="/newsletter">Browse all collector stories</a></section><section class="section"><h2>Get the next collector story</h2><a class="button red" href="${esc(i.subscribeUrl||'/newsletter/subscribe')}">Subscribe</a></section>`;
  fetch('/api/newsletter?action=issues').then(r=>r.json()).then(x=>{
    const related=(x.issues||[]).filter(story=>story.slug!==i.slug).slice(0,3),section=document.querySelector('#relatedStories');
    if(related.length)section.innerHTML=`<h2>More collector stories</h2><div class="related-grid">${related.map(story=>`<a class="related-card" href="/newsletter/${esc(story.slug)}">${story.images?.[0]?.url?`<img src="${esc(story.images[0].url)}" alt="">`:''}<strong>${esc(story.title)}</strong><span>${esc(story.dek||story.summary||'Read the story')}</span></a>`).join('')}</div><a class="button" href="/newsletter">Browse all collector stories</a>`;
  }).catch(()=>{});
}).catch(e=>document.querySelector('#issue').innerHTML=`<h1>Story not found</h1><p>${esc(e.message)}</p>`);
</script>
</body></html>
