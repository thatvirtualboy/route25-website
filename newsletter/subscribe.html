<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscribe — Route 25 Collector Stories</title><link rel="stylesheet" href="/newsletter/newsletter.css"></head>
<body><header><a class="brand" href="/">Route <span>25</span></a><nav><a href="/search">Search</a><a href="/newsletter">Collector Stories</a></nav></header>
<main><p class="eyebrow">Route 25 Collector Stories</p><h1>Meet a new collector.</h1><p class="lede">Get collection tours, favorite cards, current chases, and trusted gear in your inbox.</p>
<form id="form" class="section"><label>Email</label><input name="email" type="email" maxlength="254" required placeholder="trainer@example.com"><label class="check"><input name="consent" type="checkbox" required> I agree to receive Route 25 collector emails. I can unsubscribe at any time.</label><div id="turnstileWidget" class="turnstile-widget"></div><p><button class="red">Subscribe</button></p><p><small>See the <a href="/newsletter/privacy">privacy and data policy</a>.</small></p><div id="result"></div></form></main>
<footer>Route 25 · Celebrating Pokémon collectors.</footer>
<script>
let turnstileEnabled=false,turnstileToken='',turnstileWidgetId=null;
window.onTurnstileLoad=async()=>{const response=await fetch('/api/newsletter?action=public-config'),config=await response.json();turnstileEnabled=!!config.turnstile?.enabled;if(turnstileEnabled)turnstileWidgetId=turnstile.render('#turnstileWidget',{sitekey:config.turnstile.siteKey,theme:'dark',size:'flexible',appearance:'interaction-only',action:'newsletter_subscribe',callback:token=>{turnstileToken=token}})};
{const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad';script.defer=true;document.head.appendChild(script)}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const button=e.submitter,result=document.querySelector('#result');if(turnstileEnabled&&!turnstileToken){result.innerHTML='<p class="notice">Please complete the human verification.</p>';return}button.disabled=true;button.textContent='Subscribing…';try{const email=new FormData(e.target).get('email'),response=await fetch('/api/newsletter?action=subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,consent:true,source:'subscribe-page',turnstileToken})}),data=await response.json();if(!response.ok)throw Error(data.error);result.innerHTML='<p class="notice">You’re on the list. Welcome to Route 25 Collector Stories.</p>'}catch(error){result.innerHTML='<p class="notice"></p>';result.querySelector('.notice').textContent=error.message;if(turnstileEnabled&&turnstileWidgetId!==null){turnstile.reset(turnstileWidgetId);turnstileToken=''}}finally{button.disabled=false;button.textContent='Subscribe'}};
</script></body></html>
