<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscribe — Route 25 Collector Stories</title><link rel="stylesheet" href="/newsletter/newsletter.css"></head><body><header><a class="brand" href="/">Route <span>25</span></a><nav><a href="/newsletter">Collector Stories</a></nav></header><main><p class="eyebrow">Route 25 Collector Stories</p><h1>Meet a new collector.</h1><p class="lede">Get collection tours, favorite cards, current chases, and trusted gear in your inbox.</p><form id="form" class="section"><label>Email</label><input name="email" type="email" maxlength="254" required placeholder="trainer@example.com"><label class="check"><input name="consent" type="checkbox" required> I agree to receive Route 25 collector emails. I can unsubscribe at any time.</label><p><button class="red">Subscribe</button></p><div id="result"></div></form></main><footer>Route 25 · Celebrating Pokémon collectors.</footer><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const email=new FormData(e.target).get('email'),r=await fetch('/api/newsletter?action=subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,consent:true,source:'subscribe-page'})}),x=await r.json();document.querySelector('#result').innerHTML=r.ok?'<p class="notice">You’re on the list. Welcome to Route 25 Collector Stories.</p>':`<p class="notice">${x.error}</p>`};</script></body></html>
